name: Ofertas de Hardware
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      testar_webhook:
        description: 'Enviar apenas uma mensagem de teste no Discord'
        type: boolean
        default: false
      enviar_ultimo_jogo:
        description: 'Enviar a promoção de jogo mais recente no Discord'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ofertas-discord
  cancel-in-progress: false
jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar e enviar ofertas
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TESTAR: ${{ inputs.testar_webhook }}
          ULTIMO_JOGO: ${{ inputs.enviar_ultimo_jogo }}
        run: |
          if [ "$ULTIMO_JOGO" = "true" ]; then
            python bot.py --send-latest-game
          elif [ "$TESTAR" = "true" ]; then
            python bot.py --test-webhook
          else
            python bot.py
            sleep 150
            python bot.py
          fi
      - name: Salvar histórico inclusive após falha parcial
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Atualizar histórico de ofertas [skip ci]'
              git push
            fi
          fi
